<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StrongNew">
  <title>StrongNew</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="topline">
    <img class="logo" src="../icon-192.png" alt="StrongNew">
    <div class="brand"><b>StrongNew</b><small id="subtitle">Ładowanie aplikacji…</small></div>
  </div>
  <div class="toolbar">
    <select id="competitionSelect" aria-label="Aktywne zawody"></select>
    <button id="installButton" class="install" hidden>Zainstaluj aplikację</button>
    <button id="newCompetitionTop">+ Zawody</button>
    <button id="exportButton">Eksport</button>
  </div>
</header>
<main>
  <div id="notice" class="notice">Uruchamianie samodzielnej wersji PWA…</div>
  <nav class="tabs">
    <button data-view="competitions">Zawody</button>
    <button data-view="setup">Przygotowanie</button>
    <button data-view="scoring">Wyniki</button>
    <button data-view="standings">Tabela</button>
  </nav>
  <section id="view"></section>
  <div class="footer">StrongNew 1.0.0 · dane pozostają na tym urządzeniu · praca offline</div>
</main>
<input id="fileInput" type="file" accept="application/json,.json" hidden>
<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
